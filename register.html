{% extends 'base.html' %}

{% block content %}
<div class="card fade-in" style="max-width: 600px;">
    <h2 class="text-center mb-4">Complete Registration</h2>
    <p class="text-center text-muted mb-4">Please provide your details for the emergency alert system.</p>

    <form action="{{ url_for('register') }}" method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label for="photo">Your Photo (For Face Recognition)</label>
            <input type="file" id="photo" name="photo" accept="image/*" required>
            <p class="text-sm text-muted" style="margin-top: 0.25rem;">Please upload a clear photo of your face.</p>
        </div>

        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required placeholder="John Doe">
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required placeholder="john@example.com">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="Create a strong password">
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" required placeholder="+1 234 567 8900">
        </div>

        <div class="form-group">
            <label for="emergency_contact1">Emergency Contact 1 (Phone)</label>
            <input type="tel" id="emergency_contact1" name="emergency_contact1" required placeholder="Parent/Guardian">
        </div>

        <div class="form-group">
            <label for="emergency_contact2">Emergency Contact 2 (Phone) - Optional</label>
            <input type="tel" id="emergency_contact2" name="emergency_contact2" placeholder="Friend/Relative">
        </div>

        <div class="form-group">
            <label for="address">Home Address</label>
            <textarea id="address" name="address" rows="3" required placeholder="123 Safety St, Secure City"></textarea>
        </div>

        <button type="submit" class="btn">Complete Registration</button>
    </form>
</div>
{% endblock %}
